name: xalgorix-realbench-metabase-rce

services:
  vulnerable:
    image: metabase/metabase:v0.46.6@sha256:e35de273692f7d95c54225abbd837a7b594e44ad42a47d8ae750293825215273
    environment: &metabase-environment
      MB_CHECK_FOR_UPDATES: "false"
      MB_ENABLE_EMBEDDING: "false"
      JAVA_TIMEZONE: UTC
    expose:
      - "3000"
    networks:
      - isolated
      - egress
    restart: "no"

  fixed-control:
    image: metabase/metabase:v0.46.6.4@sha256:95c60db0c87c5da9cb81f6aefd0cd548fe2c14ff8c8dcba2ea58a338865cdbd9
    environment: *metabase-environment
    expose:
      - "3000"
    networks:
      - isolated
      - egress
    restart: "no"

  ingress:
    image: haproxy:2.8-alpine@sha256:8b55c9e7a09cb729288f4f998a10fc3a98cf3d70a7bba822e07ce167664d9e67
    depends_on:
      - vulnerable
      - fixed-control
    ports:
      - "127.0.0.1:3320:3320"
      - "127.0.0.1:3321:3321"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - isolated
      - ingress
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: "no"

networks:
  isolated:
    internal: true
  ingress:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "127.0.0.1"
  # Metabase RCE is blind. Outbound-only connectivity lets a scan prove code
  # execution with a harmless OAST callback while all inbound target access
  # remains restricted to the loopback-bound HAProxy listeners above.
  egress:
    driver: bridge
