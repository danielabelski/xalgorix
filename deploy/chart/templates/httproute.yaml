{{- if .Values.httproute.enabled -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "xalgorix.fullname" . }}
  labels:
    {{- include "xalgorix.labels" . | nindent 4 }}
  {{- with .Values.httproute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ required "httproute.gateway.name is required when httproute.enabled is true" .Values.httproute.gateway.name }}
      {{- with .Values.httproute.gateway.namespace }}
      namespace: {{ . }}
      {{- end }}
      group: gateway.networking.k8s.io
      kind: Gateway
  {{- $hostnames := .Values.httproute.hostnames }}
  {{- if .Values.httproute.hostname }}
  {{-   $hostnames = append $hostnames .Values.httproute.hostname }}
  {{- end }}
  {{- with $hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - matches:
        {{- toYaml .Values.httproute.matches | nindent 8 }}
      backendRefs:
        - name: {{ include "xalgorix.fullname" . }}
          port: {{ .Values.service.port }}
          group: ""
          kind: Service
{{- end }}
